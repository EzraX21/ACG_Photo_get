name: Build exe for ACG_Photo_get

permissions:
  contents: write

# 触发条件：推送以 'v' 开头的标签时打包；也可手动触发用于验证。
on:
  push:
    tags:
      - "v*"
  # 非 tag 触发时不创建 release（见下方 Create Release 的 if）。
  workflow_dispatch:

jobs:
  pyinstaller-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv 
          uv sync

      # 下载 flet-windows.zip 并打包进 exe，否则运行时会尝试从 GitHub
      # 下载（碰到没有受信 CA 的机器就会 TLS 校验失败）。
      # hook-flet.py 只收集解压后的目录，运行时找的是归档。
      - name: Download Flet Windows client
        id: flet_client
        run: |
          $ver = "1.1.2"
          $url = "https://github.com/flet-dev/flet/releases/download/v$ver/flet-windows.zip"
          $out = "flet-windows.zip"
          Write-Host "Downloading $url ..."
          Invoke-WebRequest -Uri $url -OutFile $out
          Write-Host "Downloaded $out ($(Get-Item $out).Length bytes)"
          echo "path=$out" >> $env:GITHUB_OUTPUT

      - name: Build exe
        # Windows runner 默认 shell 是 pwsh，不认 cmd 的 `^` 续行符，
        # 用 PowerShell 的反引号。
        run: |
          uv run pyinstaller --onefile -w --name=ACG_Photo_Get-windows-x86_64 `
            --add-data "${{ steps.flet_client.outputs.path }};flet_desktop/app" `
            gui.py

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ACG_Photo_Get-windows-x86_64.exe
