name: Build and Release on linux 
on:
  push:
    tags:
      - "v*"
  # 允许在打 tag 之前先手动跑一次打包，确认依赖和 hook 没问题。
  # 非 tag 触发时不会创建 release（见下方 Create Release 的 if）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pyinstaller-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync  

      - name: Build
        run: |
          uv run pyinstaller --onefile -w --name=ACG_Photo_Get-linux-x86_64 gui.py

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
