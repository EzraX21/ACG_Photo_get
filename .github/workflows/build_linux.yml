name: Build and Release on linux 
on:
  push:
    tags:
      - "v*"
  # 允许在打 tag 之前先手动跑一次打包，确认依赖和 hook 没问题。
  # 非 tag 触发时不会创建 release（见下方 Create Release 的 if）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pyinstaller-build:
    # 必须固定在 22.04，不能用 ubuntu-latest。
    #
    # PyInstaller 会把构建机的系统库（libgtk-3、libglib、libcairo 等）
    # 一起打进包里。ubuntu-latest 现在是 24.04，这些库要求
    # GLIBC_2.38 / 2.43，而老系统只有 2.35 / 2.31 —— 用户机器上直接
    # `version GLIBC_2.38 not found` 起不来。
    # 22.04 是 GitHub 还提供的最老镜像，用它构建能把要求压到 2.35。
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync  

      # 下载 flet-linux 归档并打包进 exe，否则运行时会尝试从 GitHub
      # 下载（碰到没有受信 CA 的机器就会 TLS 校验失败）。
      # hook-flet.py 只收集解压后的目录，运行时找的是归档。
      #
      # 关键：Linux 归档名带发行版（flet-linux-<distro>-light-<arch>.tar.gz），
      # 而运行时 get_artifact_filename() 按**本机 glibc** 算这个名字。
      # 只打构建机那一个的话，用户机器 glibc 不同就找不到归档，退回联网下载。
      # 所以把所有可用的发行版构建都打进去，运行时自己挑匹配的那个。
      - name: Download Flet Linux clients
        id: flet_client
        # 必须走 uv run：系统 python3 没装项目依赖，import flet_desktop 会失败。
        run: uv run python scripts/stage_flet_clients.py --out flet-clients --github-output "$GITHUB_OUTPUT"

      - name: Build
        run: |
          uv run pyinstaller --onefile -w --name=ACG_Photo_Get-linux-x86_64 \
            ${{ steps.flet_client.outputs.args }} \
            gui.py

      # PyInstaller 会把构建机的系统库一起打进去。这里断言这些库的
      # GLIBC 要求不超过构建机自己的 glibc —— 超过了就等于打出一个
      # 只能在更新系统上跑的包。这个坑真实发生过：runner 是 24.04 时
      # 打进去的 libgtk-3 要求 GLIBC_2.38，22.04 用户直接起不来。
      - name: Verify bundled libs match build glibc
        run: |
          set -euo pipefail
          host_glibc="$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')"
          echo "build machine glibc: $host_glibc"
          tmp="$(mktemp -d)"
          cat > "$tmp/check.py" <<'PY'
          import re, subprocess, sys, tempfile, os
          from PyInstaller.archive.readers import CArchiveReader

          exe = sys.argv[1]
          host = tuple(int(x) for x in sys.argv[2].split("."))
          r = CArchiveReader(exe)

          worst = (0, 0)
          offenders = []
          for name in r.toc:
              if not name.endswith(".so") and ".so." not in name:
                  continue
              try:
                  data = r.extract(name)
              except Exception:
                  continue
              p = tempfile.mktemp(suffix=".so")
              open(p, "wb").write(data)
              try:
                  out = subprocess.run(["objdump", "-T", p],
                                       capture_output=True, text=True).stdout
              finally:
                  os.unlink(p)
              for m in re.findall(r"GLIBC_(\d+)\.(\d+)", out):
                  v = (int(m[0]), int(m[1]))
                  if v > worst:
                      worst = v
                  if v > host:
                      offenders.append((name, f"GLIBC_{m[0]}.{m[1]}"))

          print(f"highest GLIBC requirement in bundled libs: {worst[0]}.{worst[1]}")
          if offenders:
              print("ERROR: 以下库要求的 glibc 高于构建机，用户机器会起不来：")
              for n, v in offenders[:20]:
                  print(f"  {n} requires {v}")
              sys.exit(1)
          print("OK: all bundled libs run on this glibc")
          PY
          uv run python "$tmp/check.py" dist/ACG_Photo_Get-linux-x86_64 "$host_glibc"

      # 打包产物上传，便于在推 tag 之前下载下来实测。
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ACG_Photo_Get-linux-x86_64
          path: dist/ACG_Photo_Get-linux-x86_64

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
