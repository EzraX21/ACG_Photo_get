name: Build and Release on linux 
on:
  push:
    tags:
      - "v*"
  # 允许在打 tag 之前先手动跑一次打包，确认依赖和 hook 没问题。
  # 非 tag 触发时不会创建 release（见下方 Create Release 的 if）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pyinstaller-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync  

      # 下载 flet-linux 归档并打包进 exe，否则运行时会尝试从 GitHub
      # 下载（碰到没有受信 CA 的机器就会 TLS 校验失败）。
      # hook-flet.py 只收集解压后的目录，运行时找的是归档。
      #
      # 关键：Linux 归档名带发行版（flet-linux-<distro>-light-<arch>.tar.gz），
      # 而运行时 get_artifact_filename() 按**本机 glibc** 算这个名字。
      # 只打构建机那一个的话，用户机器 glibc 不同就找不到归档，退回联网下载。
      # 所以把所有可用的发行版构建都打进去，运行时自己挑匹配的那个。
      - name: Download Flet Linux clients
        id: flet_client
        run: python3 scripts/stage_flet_clients.py --out flet-clients --github-output "$GITHUB_OUTPUT"

      - name: Build
        run: |
          uv run pyinstaller --onefile -w --name=ACG_Photo_Get-linux-x86_64 \
            ${{ steps.flet_client.outputs.args }} \
            gui.py

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
