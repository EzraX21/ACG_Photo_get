[project]
name = "photo-get"
version = "1.1.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "flet-permission-handler==1.1.2",
    "requests>=2.34.2",
    "pyjnius; sys_platform == 'android'",
]

[tool.flet.app]
# 入口是 gui.py（main.py 是下载逻辑，不启动 UI）
module = "gui"

[tool.flet.android]
# Android 上调 MediaScannerConnection 刷新相册需要。
# 主依赖里的 pyjnius marker 在打包时按宿主平台求值会跳过，这里显式带上。
dependencies = [
    "pyjnius",
]

[tool.flet.android.permission]
# 写公共目录、让相册可见所需的"所有文件访问"权限
"android.permission.MANAGE_EXTERNAL_STORAGE" = true
# 旧版本 Android 的读写权限，13 以上用不到，限制到 32 封顶
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "flet-cli==1.1.2",
    # flet_cli 的 PyInstaller hook 在顶层 `import flet_desktop`，
    # 而基础 flet 不带这个包。缺了它 Linux/Windows 打包会在
    # ImportErrorWhenRunningHook 处直接失败。
    # 只能放 dev：flet-desktop 没有 Android wheel，进运行时依赖会
    # 让 serious_python 的 --only-binary :all: 打包步骤失败。
    "flet-desktop==1.1.2",
    # tests/ 用的是 pytest 风格（def test_*(monkeypatch)），
    # `python3 -m unittest discover` 会收集到 0 个用例却照样报 OK。
    "pytest>=8.0",
]
